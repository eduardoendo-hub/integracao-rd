[project]
name = "integracao-rd"
version = "0.1.0"
description = "Microserviço de integração entre LPs Impacta e RD CRM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
